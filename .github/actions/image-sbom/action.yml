name: Image SBOM
description: >-
  Generate a CycloneDX software bill of materials for an image the job has just built and
  pushed, keep it as a workflow artifact, and attach it to the image in GHCR so it can be found
  from the image tag (the commit SHA) for as long as the image exists (OWASP A03, #614).

inputs:
  image:
    description: Full reference the build step pushed, e.g. ghcr.io/dfe-digital/check-performance-data:<sha>
    required: true
  name:
    description: Short name for the artifact file, e.g. web or worker
    required: true
  github-token:
    description: Token with packages:write for the image's GHCR package (secrets.GITHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Name the SBOM after the image tag
      id: names
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        NAME: ${{ inputs.name }}
      run: |
        # The tag is the commit sha, so the artifact can be found from the sha alone.
        tag="${IMAGE##*:}"
        echo "file=sbom-${NAME}-${tag}.cdx.json" >> "$GITHUB_OUTPUT"

    - name: Generate the SBOM
      uses: anchore/sbom-action@v0
      with:
        # Read from the runner's Docker daemon, where build-docker-image loaded the image
        # under this same tag; syft would pull the (public) tag from GHCR if it were missing.
        image: ${{ inputs.image }}
        format: cyclonedx-json
        output-file: ${{ runner.temp }}/${{ steps.names.outputs.file }}
        artifact-name: ${{ steps.names.outputs.file }}
        upload-artifact: true
        upload-release-assets: false
        dependency-snapshot: false

    - name: Set up ORAS
      uses: oras-project/setup-oras@v2
      with:
        # A version the attach and discover behaviour on GHCR was checked with. 1.3.5 was too,
        # but setup-oras@v2 does not offer it yet.
        version: 1.3.1

    - name: Attach the SBOM to the image in GHCR
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        IMAGE: ${{ inputs.image }}
        FILE: ${{ steps.names.outputs.file }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # Workflow artifacts expire (90 days on a public repository); the copy attached to the
        # image lives as long as the image. GHCR has no OCI referrers API, so ORAS falls back to
        # the referrers tag schema: the SBOM manifest's subject is the image manifest, and an
        # index tagged sha256-<image digest> in the same package lists it. Do not delete those
        # tags. `oras discover <image>` reads the index.
        echo "$GITHUB_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        digest=$(oras resolve "$IMAGE")
        # The SBOM describes a digest, so it is attached once per digest; a second attach would
        # rewrite the referrers index. When the layer cache is hit, a docs-only pull request, a
        # re-run and the merge build resolve to a digest an earlier build already described;
        # otherwise the image gets a new digest and its own SBOM.
        existing=$(oras discover "$IMAGE" --artifact-type application/vnd.cyclonedx+json --format json | jq '.referrers | length')
        if [ "$existing" -gt 0 ]; then
          echo "$IMAGE ($digest) already has an SBOM attached; not attaching another."
          attached="already attached by an earlier build of this digest"
        else
          oras attach --artifact-type application/vnd.cyclonedx+json "$IMAGE" "$FILE:application/vnd.cyclonedx+json"
          attached="attached by this run"
        fi
        oras discover "$IMAGE"
        {
          echo "### SBOM for \`$IMAGE\`"
          echo
          echo "Image digest \`$digest\`. Workflow artifact \`$FILE\`; SBOM in GHCR: $attached."
          echo
          echo '```sh'
          echo "oras discover $IMAGE"
          echo '```'
          echo
          echo "See \`docs/sbom.md\` for fetching and querying it."
        } >> "$GITHUB_STEP_SUMMARY"
