name: Build and Deploy
concurrency: build_and_deploy_${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        type: choice
        default: review
        options:
          - development
          - qa
          - preproduction
          - production
      docker-image-tag:
        description: "Docker image tag to deploy (optional)"
        required: true
        type: string
      worker-docker-image-tag:
        description: "Worker docker image tag to deploy (optional)"
        required: false
        type: string
      pull-request-number:
        description: "Pull request number (required for review environment)"
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, labeled, unlabeled]

env:
  TERRAFORM_BASE: terraform/application
  HEALTHCHECK_CMD: "healthcheck"

jobs:
  build:
    name: Build
    if: ${{ github.event_name != 'workflow_dispatch' }}
    env:
      DOCKER_REPOSITORY: ghcr.io/dfe-digital/check-performance-data
      WORKER_DOCKER_REPOSITORY: ghcr.io/dfe-digital/check-performance-data-worker
    outputs:
      docker-image-tag: ${{ steps.build-image.outputs.tag }}
      worker-docker-image-tag: ${{ steps.build-worker-image.outputs.tag }}
    permissions:
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Build and push docker image
        id: build-image
        uses: DFE-Digital/github-actions/build-docker-image@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ./src
          dockerfile-path: ./src/DfE.CheckPerformanceData.Web/Dockerfile
          # Without a target Docker builds the last stage, which is the VS Code
          # debug image (vsdbg, wget, unzip). Deploy the plain runtime stage.
          target: runtime
          docker-repository: ${{ env.DOCKER_REPOSITORY }}
          max-cache: true
          reuse-cache: true
          snyk-token: ${{ secrets.SNYK_TOKEN }}

      - name: Build and push worker docker image
        id: build-worker-image
        uses: DFE-Digital/github-actions/build-docker-image@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          context: ./src
          dockerfile-path: ./src/DfE.CheckPerformanceData.RulesEngineWorker/Dockerfile
          target: final
          docker-repository: ${{ env.WORKER_DOCKER_REPOSITORY }}
          max-cache: true
          reuse-cache: true
          snyk-token: ${{ secrets.SNYK_TOKEN }}

  e2e:
    name: E2E smoke tests
    # The smoke subset only (Category=Smoke): a few minutes to show that the review app is up
    # and that each area of the service and each journey still works. The whole suite runs
    # afterwards in its own workflow, e2e.yml, which is not one of the pull request's checks
    # and reports in a comment on the pull request.
    #
    # When the smoke set fails, a comment on the pull request names the failed tests and
    # mentions whoever opened it, so that GitHub notifies them.
    #
    # Only runs against the per-PR review app. The main-branch `deploy` job uses a strategy
    # matrix [development, qa, preproduction, production] with max-parallel: 1 and exposes
    # environment_url as a job-level output; that output is overwritten by each matrix entry
    # so it ultimately resolves to production. The E2E suite seeds wiki pages and content
    # blocks (no DELETE route on ContentBlockController), so running it against production
    # would pollute live data. Until a non-production-only output channel exists, e2e is
    # gated to review-app PRs only.
    needs: [deploy-review-app]
    if: needs.deploy-review-app.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CPD_E2E_BASE_URL: ${{ needs.deploy-review-app.outputs.environment_url }}
      # Failure-gated Playwright traces (SeedingPageTest writes one zip per failing
      # test here; the Upload failure traces step below pulls them into an artifact).
      # Absolute: the testhost resolves a relative value against its own CWD (the
      # compiled output dir), which would orphan the zips away from the upload step.
      CPD_E2E_TRACES_DIR: ${{ github.workspace }}/e2e-traces

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/DfE.CheckPerformanceData.E2ETests/DfE.CheckPerformanceData.E2ETests.csproj') }}

      - name: Build E2E test project
        run: dotnet build tests/DfE.CheckPerformanceData.E2ETests/ -c Release

      - name: Install Playwright browsers
        run: pwsh tests/DfE.CheckPerformanceData.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E smoke tests
        run: >-
          dotnet test tests/DfE.CheckPerformanceData.E2ETests/ --configuration Release --no-build
          --filter "Category=Smoke"
          --logger "trx;LogFileName=e2e-smoke.trx" --results-directory TestResults

      # A failure gets a new comment that mentions the author, because GitHub notifies people
      # of a new comment and not of an edit. A pass only tidies up: it edits the comment an
      # earlier failure left, and says nothing if there is none.
      - name: Tell the author when the smoke tests fail
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_MARKER: "<!-- e2e-smoke-tests-result -->"
          JOB_STATUS: ${{ job.status }}
        run: |
          pwsh scripts/e2e-summary.ps1 -ResultsFile TestResults/e2e-smoke.trx -OutFile summary.md \
            -Name "E2E smoke tests" -Commit "$SHA" -AppUrl "$CPD_E2E_BASE_URL" -RunUrl "$RUN_URL" -Author "$AUTHOR"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          { echo "$COMMENT_MARKER"; cat summary.md; } > comment.md
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" | tail -n 1)
          if [[ "$JOB_STATUS" == "success" ]]; then
            [[ -z "$id" ]] || gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md --silent
          else
            [[ -z "$id" ]] || gh api --method DELETE "repos/$GH_REPO/issues/comments/$id" --silent
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md --silent
          fi

      # Surface the snapshot tree on failure so the "delete .png + push twice"
      # update workflow can retrieve the regenerated PNG. Snapshots live under the
      # source tree (resolved via project marker walk in PageSnapshotExtensions),
      # not under bin/, so the path here points at the source location.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-snapshots
          path: tests/DfE.CheckPerformanceData.E2ETests/Snapshots/
          retention-days: 14

      # Playwright traces for the failing tests only (the harness writes nothing on a
      # green run). Open them with `npx playwright show-trace <file>.zip` or the trace
      # viewer in the artifact. Name is obscured to {ClassName}.{ordinal}.zip — open a
      # trace to see which test it belongs to (its title is set to the class name).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: e2e-traces/
          if-no-files-found: warn
          retention-days: 14

  deploy-review-app:
    name: Deployment To Review
    concurrency: deploy_review_${{ github.event.pull_request.number }}
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy') }}
    needs: [build]
    environment:
      name: review
      url: ${{ steps.deploy_review.outputs.environment_url }}
    runs-on: ubuntu-latest
    outputs:
      environment_url: ${{ steps.deploy_review.outputs.environment_url }}
    permissions:
      id-token: write
      pull-requests: write

    steps:
      - name: Deploy App to Review
        id: deploy_review
        uses: DFE-Digital/github-actions/deploy-to-aks@master
        env:
          # deploy-to-aks@master does not yet declare a `worker-sha` input, so
          # passing it via `with:` is silently dropped. Set the Terraform variable
          # directly. Remove this env block once the upstream action accepts
          # `worker-sha` and add the `worker-sha:` line back into `with:` below.
          TF_VAR_worker_docker_image: ghcr.io/dfe-digital/check-performance-data-worker:${{ needs.build.outputs.worker-docker-image-tag }}
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          environment: review
          pr-number: ${{ github.event.pull_request.number }}
          sha: ${{ needs.build.outputs.docker-image-tag }}
          terraform-base: ${{ env.TERRAFORM_BASE }}
          healthcheck: ${{ env.HEALTHCHECK_CMD }}
          gcp-wip: ${{ vars.GCP_WIP }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
          # db-seed: true
          # smoke-test: true
  #        gcp-wip: ${{ vars.GCP_WIP }}
  #        gcp-project-id: ${{ vars.GCP_PROJECT_ID }}

  deploy:
    name: Deploy environments
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    environment:
      name: ${{ matrix.environment }}
      url: ${{ steps.deploy_app.outputs.environment_url }}
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      environment_url: ${{ steps.deploy_app.outputs.environment_url }}
    permissions:
      id-token: write
      pull-requests: write
    strategy:
      max-parallel: 1
      matrix:
        environment: [development, qa, preproduction, production]

    steps:
      - name: Deploy app to ${{ matrix.environment }}
        id: deploy_app
        uses: DFE-Digital/github-actions/deploy-to-aks@master
        env:
          # See note on the review-app deploy step.
          TF_VAR_worker_docker_image: ghcr.io/dfe-digital/check-performance-data-worker:${{ needs.build.outputs.worker-docker-image-tag }}
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          environment: ${{ matrix.environment }}
          sha: ${{ needs.build.outputs.docker-image-tag }}
          terraform-base: ${{ env.TERRAFORM_BASE }}
          healthcheck: ${{ env.HEALTHCHECK_CMD }}
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
          # smoke-test: true
          gcp-wip: ${{ vars.GCP_WIP }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID }}

  manual_deploy:
    name: Manual deploy
    if: ${{ github.event_name == 'workflow_dispatch' }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy_manual.outputs.environment_url }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write

    steps:
      - name: Deploy app to ${{ inputs.environment }}
        id: deploy_manual
        uses: DFE-Digital/github-actions/deploy-to-aks@master
        env:
          # See note on the review-app deploy step.
          TF_VAR_worker_docker_image: ghcr.io/dfe-digital/check-performance-data-worker:${{ inputs.worker-docker-image-tag }}
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          environment: ${{ inputs.environment }}
          pr-number: ${{ inputs.pull-request-number }}
          sha: ${{ inputs.docker-image-tag }}
          terraform-base: ${{ env.TERRAFORM_BASE }}
          healthcheck: ${{ env.HEALTHCHECK_CMD }}
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
  #        smoke-test: true
  #         db-seed: ${{ inputs.environment == 'review' && 'true' || 'false' }}
  # #        gcp-wip: ${{ vars.GCP_WIP }}
  # #        gcp-project-id: ${{ vars.GCP_PROJECT_ID }}

  deploy_domains_infra:
    name: Deploy Domains Infrastructure
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency: deploy_domains_infra
    needs: [deploy]
    environment:
      name: production
    permissions:
      id-token: write

    steps:
      - name: Deploy Domains Infrastructure
        uses: DFE-Digital/github-actions/deploy-domains-infra@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID  }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID   }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID   }}
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}

  deploy_domains_env:
    name: Deploy Domains to ${{ matrix.domain_environment }} environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency: deploy_domains_${{ matrix.domain_environment }}
    needs: [deploy_domains_infra]
    strategy:
      max-parallel: 1
      matrix:
        domain_environment: [development, qa, preproduction, production]
    environment:
      name: production
    permissions:
      id-token: write

    steps:
      - name: Deploy Domains Environment
        uses: DFE-Digital/github-actions/deploy-domains-env@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID  }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID   }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID   }}
          environment: ${{ matrix.domain_environment }}
          healthcheck: healthcheck
          teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
