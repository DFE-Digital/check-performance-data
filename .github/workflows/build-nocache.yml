name: Build No Cache

on:
  workflow_dispatch:

  schedule:
    - cron: '30 12 * * 0'
    # Will run once a week on Sunday afternoon

jobs:
  build-no-cache:
    permissions:
      packages: write
    env:
      DOCKER_REPOSITORY: ghcr.io/dfe-digital/check-performance-data
      WORKER_DOCKER_REPOSITORY: ghcr.io/dfe-digital/check-performance-data-worker
    outputs:
      docker-image-tag: ${{ steps.build-image.outputs.tag }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      name: Checkout

    - name: Build without cache and push docker image
      id: build-image
      uses: DFE-Digital/github-actions/build-docker-image@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        context: ./src
        dockerfile-path: ./src/DfE.CheckPerformanceData.Web/Dockerfile
        target: runtime
        docker-repository: ${{ env.DOCKER_REPOSITORY }}
        max-cache: true
        reuse-cache: false
        snyk-token: ${{ secrets.SNYK_TOKEN }}

    - name: SBOM for the web image
      # The weekly rebuild pushes a fresh image under the same sha tag, so it needs its own SBOM.
      uses: ./.github/actions/image-sbom
      with:
        image: ${{ steps.build-image.outputs.image }}
        name: web
        github-token: ${{ secrets.GITHUB_TOKEN }}

    # The worker image installs curl, so it gets OS package fixes that the web image does not.
    # Rebuild it here too, or its cached package layer stays old until its base digest changes.
    - name: Build without cache and push worker docker image
      id: build-worker-image
      uses: DFE-Digital/github-actions/build-docker-image@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        context: ./src
        dockerfile-path: ./src/DfE.CheckPerformanceData.RulesEngineWorker/Dockerfile
        target: final
        docker-repository: ${{ env.WORKER_DOCKER_REPOSITORY }}
        max-cache: true
        reuse-cache: false
        snyk-token: ${{ secrets.SNYK_TOKEN }}

    - name: SBOM for the worker image
      uses: ./.github/actions/image-sbom
      with:
        image: ${{ steps.build-worker-image.outputs.image }}
        name: worker
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify teams channel on job failure
      uses: DFE-Digital/github-actions/send-to-teams-channel@master
      if: ${{ failure() }}
      with:
        teams-webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        title: "Build failure"
        service: ${{ vars.TEAMS_MSG_SERVICE_NAME }}
        message: |
          "Rebuild docker cache failure"
