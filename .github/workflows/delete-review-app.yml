name: Delete Review App

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number of review app to delete
        required: true
        type: string

jobs:
  delete-review-app:
    name: Delete Review App ${{ github.event.pull_request.number }}
    concurrency: deploy_review_${{ github.event.pull_request.number }}
    environment: review
    if: contains(github.event.pull_request.labels.*.name, 'deploy') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: "read"
      contents: "read"
      id-token: "write"
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: set PR_NUMBER
        id: config
        run: |
          if [ ${{ github.event_name }} == 'workflow_dispatch' ]; then
            PR_NUMBER=${{ github.event.inputs.pr_number }}
          else
            PR_NUMBER=${{ github.event.pull_request.number }}
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "ENVIRONMENT=pr-${PR_NUMBER}" >> $GITHUB_ENV

      # The whole E2E suite is not one of the pull request's checks, so a pull request can be
      # merged while it is still running against the review app. Deleting the app then fails
      # every test left. Wait for the run to finish, but not for ever: the run reports itself
      # as interrupted if the app goes from under it.
      - name: Wait for the pull request's E2E run to finish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          MAX_WAIT_MINUTES: 45
        run: |
          [[ -n "$BRANCH" ]] || BRANCH=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.ref) || BRANCH=""
          # E2E Tests names each run after the branch, or the pull request when run by hand.
          names=$(jq -cn --arg branch "E2E Tests for $BRANCH" --arg pr "E2E Tests for pull request $PR_NUMBER" '[$branch, $pr]')
          for (( waited = 0; ; waited++ )); do
            running=$(gh api "repos/$GH_REPO/actions/workflows/e2e.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and (.display_title | IN($names[])))] | length") \
              || running=0
            (( running == 0 )) && break
            if (( waited >= MAX_WAIT_MINUTES * 2 )); then
              echo "::warning::An E2E run for pull request $PR_NUMBER is still going after $MAX_WAIT_MINUTES minutes. Deleting the review app anyway."
              break
            fi
            echo "An E2E run for pull request $PR_NUMBER is still going. Checking again in 30 seconds."
            sleep 30
          done

      - name: Set environment variables
        shell: bash
        run: |
          source global_config/review.sh
          echo "AZURE_RESOURCE_PREFIX=${AZURE_RESOURCE_PREFIX}" >> $GITHUB_ENV
          echo "CONFIG_SHORT=${CONFIG_SHORT}" >> $GITHUB_ENV

      - name: Set Airbyte
        if: (contains(github.event.pull_request.labels.*.name, 'airbyte'))
        run: |
          echo "TF_VAR_pg_airbyte_enabled=true" >> $GITHUB_ENV
          echo "TF_VAR_airbyte_enabled=true" >> $GITHUB_ENV
          echo "TF_VAR_connection_status=active" >> $GITHUB_ENV

      - name: Delete Review App
        id: delete-review-app
        uses: DFE-Digital/github-actions/delete-review-app@master
        env:
          # terraform destroy still requires every root variable; the value is
          # never used. See the matching note on the deploy steps in
          # build-and-deploy.yml.
          TF_VAR_worker_docker_image: ghcr.io/dfe-digital/check-performance-data-worker:unused
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          container-name: terraform-state
          gcp-wip: ${{ vars.GCP_WIP }}
          gcp-project-id: ${{ vars.GCP_PROJECT_ID }}
          pr-number: ${{ env.PR_NUMBER }}
          resource-group-name: "${{ env.AZURE_RESOURCE_PREFIX }}-cypd-${{ env.CONFIG_SHORT }}-rg"
          storage-account-name: "${{ env.AZURE_RESOURCE_PREFIX }}cypd${{ env.CONFIG_SHORT }}tfsa"
          tf-state-file: "${{ env.ENVIRONMENT }}_kubernetes.tfstate"
