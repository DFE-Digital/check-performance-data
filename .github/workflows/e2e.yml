name: E2E Tests

# The whole browser suite, run against a pull request's review app once "Build and Deploy" has
# deployed it.
#
# A run started by workflow_run belongs to the default branch, not to the pull request's
# commit, so it is not one of the pull request's checks: nothing waits for it and it cannot
# stop a merge. The result goes in a comment on the pull request. When the run does not pass,
# the comment is a new one that mentions whoever opened the pull request, so that GitHub
# notifies them, by email unless they have turned that off.
#
# GitHub reads a workflow_run workflow from the default branch, so a change to this file does
# nothing until it is merged. Try a change with "Run workflow" and a pull request number.
#
# There is no concurrency group on purpose. A run is never cancelled or dropped because a
# newer one started, so a failure stays with the commit that caused it. Cancel one by hand if
# it is no longer wanted.
#
# Delete Review App waits while a run for the same pull request is going, and finds it by the
# run name below, so keep the two in step.

run-name: E2E Tests for ${{ github.event.workflow_run.head_branch || format('pull request {0}', inputs.pull-request-number) }}

on:
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      pull-request-number:
        description: "Pull request whose review app to test"
        required: true
        type: string

permissions: {}

jobs:
  e2e:
    name: E2E tests
    # Pull requests from this repository only: the run uses the repository's own token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
      pull-requests: write
    env:
      # The hidden line that marks the result comment, so the same comment is found and
      # updated on the next run.
      COMMENT_MARKER: "<!-- e2e-tests-result -->"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Failure-gated Playwright traces: SeedingPageTest writes one zip per failing test here.
      # Absolute, because the test host resolves a relative value against its own output folder.
      CPD_E2E_TRACES_DIR: ${{ github.workspace }}/e2e-traces

    steps:
      - name: Find the pull request and its review app
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_RUN_ID: ${{ github.event.workflow_run.id }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_INPUT: ${{ inputs.pull-request-number }}
        run: |
          stop() { echo "$1 Nothing to test."; echo "found=false" >> "$GITHUB_OUTPUT"; exit 0; }

          if [[ -n "$PR_INPUT" ]]; then
            [[ "$PR_INPUT" =~ ^[0-9]+$ ]] || { echo "::error::'$PR_INPUT' is not a pull request number"; exit 1; }
            pr="$PR_INPUT"
            found=$(gh api "repos/$GH_REPO/pulls/$pr" \
              --jq '"\(.state) \(.head.sha) \(.head.repo.full_name) \(.user.login)"') \
              || { echo "::error::Pull request $pr was not found"; exit 1; }
            read -r state sha head_repo author <<< "$found"
            # A closed pull request has had its review app deleted.
            [[ "$state" == "open" ]] || { echo "::error::Pull request $pr is $state"; exit 1; }
            [[ "$head_repo" == "$GH_REPO" ]] || { echo "::error::Pull request $pr is from a fork"; exit 1; }
            # Newest first. A run that stood aside for a duplicate also passes, but deployed nothing.
            run_ids=$(gh api --method GET "repos/$GH_REPO/actions/workflows/build-and-deploy.yml/runs" \
              -f head_sha="$sha" -f event=pull_request \
              --jq '.workflow_runs[] | select(.conclusion == "success") | .id') || true
          else
            # A pull request without the deploy label has no review app. Neither has a run that
            # was cancelled or failed before it deployed.
            deployed=$(gh api "repos/$GH_REPO/actions/runs/$DEPLOY_RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.name == "Deployment To Review") | .conclusion')
            [[ "$deployed" == "success" ]] || stop "That run did not deploy a review app."
            sha="$DEPLOY_SHA"
            run_ids="$DEPLOY_RUN_ID"
            # read fails when it is given nothing, which is what a closed or merged pull
            # request gives it. That is a reason to stop quietly, not for the step to fail.
            read -r pr author < <(gh api "repos/$GH_REPO/commits/$sha/pulls" \
              --jq "[.[] | select(.state == \"open\" and .head.sha == \"$sha\")][0] | select(.) | \"\(.number) \(.user.login)\"") || true
            [[ -n "$pr" ]] || stop "No open pull request has $sha at its head (branch $DEPLOY_BRANCH)."
          fi

          # The deploy records the review app's address on the commit's deployment.
          url=""
          for id in $(gh api "repos/$GH_REPO/deployments?sha=$sha&environment=review" --jq '.[].id'); do
            url=$(gh api "repos/$GH_REPO/deployments/$id/statuses" \
              --jq '[.[] | select(.state == "success" and .environment_url != "")][0].environment_url // empty')
            [[ -n "$url" ]] && break
          done
          [[ -n "$url" ]] || stop "Pull request $pr has no review app deployed for $sha."

          # The tests must be the ones the review app was built with. Its build merged the pull
          # request into main as main stood then, and recorded that commit. The merge ref is
          # rebuilt whenever main moves, so it is only a fallback, for a deploy that predates the
          # record.
          ref="refs/pull/$pr/merge"
          for id in $run_ids; do
            gh run download "$id" --name review-app-commit --dir "$RUNNER_TEMP/review-app-commit-$id" 2>/dev/null || continue
            built=$(tr -d '[:space:]' < "$RUNNER_TEMP/review-app-commit-$id/review-app-commit.txt")
            [[ "$built" =~ ^[0-9a-f]{40}$ ]] && { ref="$built"; break; }
          done
          [[ "$ref" == refs/* ]] && echo "::warning::No record of the commit the review app was built from. Testing $ref."

          echo "Testing pull request $pr at $sha (tests from $ref) against $url"
          {
            echo "found=true"
            echo "pr=$pr"
            echo "sha=$sha"
            echo "ref=$ref"
            echo "url=$url"
            echo "author=$author"
          } >> "$GITHUB_OUTPUT"

      - name: Say on the pull request that the tests are running
        if: steps.target.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.target.outputs.pr }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          {
            echo "$COMMENT_MARKER"
            echo "### E2E tests running"
            echo
            echo "Commit \`${SHA:0:7}\` ([run]($RUN_URL)). The result will replace this comment."
          } > comment.md
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" | tail -n 1)
          if [[ -n "$id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md --silent
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md --silent
          fi

      # The review app was built from the pull request merged into main, so test that commit.
      - uses: actions/checkout@v7
        if: steps.target.outputs.found == 'true'
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        if: steps.target.outputs.found == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Build E2E test project
        if: steps.target.outputs.found == 'true'
        run: dotnet build tests/DfE.CheckPerformanceData.E2ETests/ -c Release

      # No cache here, unlike the smoke job. This run belongs to the default branch, so a cache
      # it saved would be shared with every branch, and it is filled while the pull request's
      # code is on the runner.
      - name: Install Playwright browsers
        if: steps.target.outputs.found == 'true'
        run: pwsh tests/DfE.CheckPerformanceData.E2ETests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        id: tests
        if: steps.target.outputs.found == 'true'
        # Everything but visual regression: the baselines are captured against the local
        # containerised web, and the review app does not render pixel for pixel the same.
        env:
          CPD_E2E_BASE_URL: ${{ steps.target.outputs.url }}
        run: >-
          dotnet test tests/DfE.CheckPerformanceData.E2ETests/ --configuration Release --no-build
          --filter "Category!=VisualRegression"
          --logger "trx;LogFileName=e2e.trx" --results-directory TestResults

      # Failures are only the change's if the review app was there, on this commit, the whole
      # time. Merging the pull request deletes the app (Delete Review App waits for this run, but
      # only for so long), and a push redeploys it.
      - name: Check the review app was there throughout
        id: app
        if: always() && steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.target.outputs.pr }}
          SHA: ${{ steps.target.outputs.sha }}
          APP_URL: ${{ steps.target.outputs.url }}
        run: |
          reason=""
          read -r state head < <(gh api "repos/$GH_REPO/pulls/$PR" --jq '"\(.state) \(.head.sha)"') || true
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$APP_URL/healthcheck") || true
          if [[ "$code" != "200" ]]; then
            if [[ "$state" == "closed" ]]; then
              reason="Pull request $PR was merged or closed during the run, and its review app was deleted."
            else
              reason="The review app stopped answering during the run (its health check gave $code)."
            fi
          elif [[ -n "$head" && "$head" != "$SHA" ]] &&
               [[ -n "$(gh api "repos/$GH_REPO/deployments?sha=$head&environment=review" --jq '.[0].id // empty')" ]]; then
            reason="Commit \`${head:0:7}\` was pushed and deployed to the review app during the run. Its own run will test it."
          fi
          if [[ -n "$reason" ]]; then
            echo "::warning::$reason"
            echo "interrupted=$reason" >> "$GITHUB_OUTPUT"
          else
            echo "The review app was there throughout, so the failures stand."
          fi

      # From here on the steps also run when the tests failed or the run was cancelled, so the
      # pull request is never left saying "running".
      - name: Summarise the results
        id: summary
        if: always() && steps.target.outputs.found == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          APP_URL: ${{ steps.target.outputs.url }}
          # Nobody is told to fix a run that someone cancelled.
          AUTHOR: ${{ job.status != 'cancelled' && steps.target.outputs.author || '' }}
          INTERRUPTED: ${{ steps.app.outputs.interrupted }}
        run: |
          pwsh scripts/e2e-summary.ps1 -ResultsFile TestResults/e2e.trx -OutFile summary.md \
            -Commit "$SHA" -AppUrl "$APP_URL" -RunUrl "$RUN_URL" -Author "$AUTHOR" -Interrupted "$INTERRUPTED"
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Put the results on the pull request
        if: always() && steps.target.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.target.outputs.pr }}
          RESULT: ${{ steps.summary.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # No summary means the run stopped before the code was checked out.
          [[ -f summary.md ]] || printf '### E2E tests produced no results\n\nThe run stopped before the tests started ([run](%s)). This is not a pass.\n' "$RUN_URL" > summary.md
          { echo "$COMMENT_MARKER"; cat summary.md; } > comment.md
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" | tail -n 1)
          # GitHub notifies people of a new comment, not of an edit to an old one. A pass
          # edits the comment in place. Anything else replaces it with a new one, so the
          # person it mentions is told. A cancelled or interrupted run is nobody's to fix: edit
          # in place.
          if [[ ("$RESULT" == "passed" || "$RESULT" == "interrupted" || "$JOB_STATUS" == "cancelled") && -n "$id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@comment.md --silent
          else
            [[ -z "$id" ]] || gh api --method DELETE "repos/$GH_REPO/issues/comments/$id" --silent
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -F body=@comment.md --silent
          fi

      - uses: actions/upload-artifact@v7
        if: always() && steps.target.outputs.found == 'true'
        with:
          name: e2e-results
          path: TestResults/
          if-no-files-found: ignore
          retention-days: 14

      # The snapshot tree, so a regenerated baseline can be fetched. Snapshots live in the
      # source tree, not under bin/.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.target.outputs.found == 'true'
        with:
          name: e2e-snapshots
          path: tests/DfE.CheckPerformanceData.E2ETests/Snapshots/
          retention-days: 14

      # Playwright traces for the failing tests only. Open one with
      # `npx playwright show-trace <file>.zip`.
      - uses: actions/upload-artifact@v7
        if: failure() && steps.target.outputs.found == 'true'
        with:
          name: e2e-traces
          path: e2e-traces/
          if-no-files-found: ignore
          retention-days: 14
