# OWASP ZAP automation plan for the review-app baseline scan (#618). docs/zap-baseline.md says what
# the scan covers and how to triage a finding.
#
# This is the plan zap-baseline.py generates, with two changes it cannot make: the spider submits
# no forms, and the dev-tools pages are out of scope. Run by the "ZAP baseline scan" job in
# .github/workflows/build-and-deploy.yml, which supplies ZAP_TARGET and mounts the workspace at
# /zap/wrk.
env:
  contexts:
    - name: review-app
      urls:
        - "${ZAP_TARGET}"
      # Review apps run with Dev:ToolsEnabled, and the header links to /dev/impersonate/*. Following
      # one would sign the spider in as an admin. Everything under /dev/ stays out of scope, so the
      # scan is of what an anonymous visitor sees.
      excludePaths:
        - ".*/dev/.*"
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      enableTags: false
      maxAlertsPerRule: 10

  - type: spider
    parameters:
      context: review-app
      url: "${ZAP_TARGET}"
      # Minutes of crawling. The anonymous surface is small; three is ample.
      maxDuration: 3
      # Never submit a form: a review app creates real Zendesk tickets, and the contact form is
      # anonymous. Forms are still parsed, so a GET form (search) is followed.
      postForm: false
      processForm: true

  - type: passiveScan-wait
    parameters:
      maxDuration: 0

  # The rules (#618). A rule that fires and is not listed here is a WARN, and the job fails on a
  # WARN once ZAP_GATE is on. IGNORE needs a customMessage naming the control that covers the
  # risk, or saying "informational". Only rules a report has raised are listed, so a rule that a
  # new ZAP release adds is noticed. The rules are at https://www.zaproxy.org/docs/alerts/<id>/.
  - type: outputSummary
    parameters:
      format: Long
      summaryFile: /zap/wrk/zap-out/summary.json
    rules:
      - id: 2
        action: IGNORE
        customMessage: "Private IP Disclosure: false positive, 10.02.68.86 is SVG path coordinates in assets/images/favicon.svg, not an address"
      - id: 10015
        action: IGNORE
        customMessage: "Re-examine Cache-control Directives: informational on anonymous pages (no-cache, no-store without private/must-revalidate; robots.txt sends none); the personal-data responses carry no-store (#615)"
      - id: 10027
        action: IGNORE
        customMessage: "Suspicious Comments: the matched block is the session diagnostic footer, which DiagnosticFooterMiddleware emits only outside Production (env.IsProduction() short-circuit, covered by DiagnosticFooterMiddlewareTests); the other hits are explanatory JS comments in _GtmHead and _ClarityHead. Follow-up #677: switch the footer off on review apps"
      - id: 10054
        action: IGNORE
        customMessage: "Cookie with SameSite Attribute None: .AspNetCore.Correlation.* is the OpenID Connect handler's correlation cookie for the DfE Sign-in redirect; ASP.NET Core sets it SameSite=None by default so the cross-site return carries it (the Secure-cookie rule 10011 passed)"
      - id: 10055
        action: IGNORE
        customMessage: "CSP: style-src 'unsafe-inline' and the Google wildcard hosts are needed by GOV.UK Frontend and Google Tag Manager; script-src is nonce-only (#611)"
      - id: 10096
        action: IGNORE
        customMessage: "Timestamp Disclosure: informational, 1904761905 is a numeric constant in minified GOV.UK Frontend CSS, not a timestamp"
      - id: 10109
        action: IGNORE
        customMessage: "Modern Web Application: informational; the matched markup is a GOV.UK placeholder link and the service is server-rendered"
      - id: 10112
        action: IGNORE
        customMessage: "Session Management Response Identified: informational; the antiforgery cookie"

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/zap-out
      reportFile: report.html
      reportTitle: ZAP baseline scan
      reportDescription: ""
  - type: report
    parameters:
      template: traditional-md
      reportDir: /zap/wrk/zap-out
      reportFile: report.md
      reportTitle: ZAP baseline scan
      reportDescription: ""
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/zap-out
      reportFile: report.json
      reportTitle: ZAP baseline scan
      reportDescription: ""
