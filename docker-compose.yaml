services:
  web:
    profiles: [web, all, e2e]
    container_name: cypd_web
    restart: unless-stopped
    build:
      context: ./src
      dockerfile: DfE.CheckPerformanceData.Web/Dockerfile
    image: cypd_web:latest
    ports: 
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Postgres=${POSTGRES_CONNECTION_STRING:-Host=db;Database=cypd;Username=postgres;Password=postgres}
      - ConnectionStrings__AzureStorage=${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;}
      - DfeSignIn__BaseUrl=${DFESIGNIN_BASEURL:-https://test-api.signin.education.gov.uk/}
      - DfeSignIn__ClientId=${DFESIGNIN_CLIENTID}
      - DfeSignIn__ApiClientSecret=${DFESIGNIN_APICLIENTSECRET}
      - DfeSignIn__Audience=${DFESIGNIN_AUDIENCE:-signin.education.gov.uk}
      - DfeSignIn__MetadataAddress=${DFESIGNIN_METADATAADDRESS:-https://test-oidc.signin.education.gov.uk/.well-known/openid-configuration}
      - DfeSignIn__ClientSecret=${DFESIGNIN_CLIENTSECRET}
      - DfeSignIn__ServiceId=${DFESIGNIN_SERVICEID}

    depends_on:
      - db
      - azurite
    networks:
      - cypd

  rules_engine:
    profiles: [rules_engine, all]
    container_name: cypd_rules_engine
    restart: unless-stopped
    build:
      context: ./src
      dockerfile: DfE.CheckPerformanceData.RulesEngineWorker/Dockerfile
    image: cypd_rules_engine:latest
    environment:
      - ConnectionStrings__Postgres=${POSTGRES_CONNECTION_STRING:-Host=db;Database=cypd;Username=postgres;Password=postgres}
      - ConnectionStrings__AzureStorage=${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;QueueEndpoint=http://azurite:10001/devstoreaccount1;}
      - DfeSignIn__BaseUrl=${DFESIGNIN_BASEURL:-https://test-api.signin.education.gov.uk/}
      - DfeSignIn__ClientId=${DFESIGNIN_CLIENTID}
      - DfeSignIn__ApiClientSecret=${DFESIGNIN_APICLIENTSECRET}
      - DfeSignIn__Audience=${DFESIGNIN_AUDIENCE:-signin.education.gov.uk}
      - DfeSignIn__MetadataAddress=${DFESIGNIN_METADATAADDRESS:-https://test-oidc.signin.education.gov.uk/.well-known/openid-configuration}
      - DfeSignIn__ClientSecret=${DFESIGNIN_CLIENTSECRET}
      - DfeSignIn__ServiceId=${DFESIGNIN_SERVICEID}
      - RulesEngineOptions__QueueName=${RULESENGINEOPTIONS_QUEUENAME:-requests}
      - RulesEngineOptions__RetryDelayMs=${RULESENGINEOPTIONS_RETRYDELAYMS:-1000}
      - RulesEngineOptions__MaxMessagesPerPoll=${RULESENGINEOPTIONS_MAXMESSAGESPERPOLL:-10}
      - RulesEngineOptions__EmptyQueueDelayMs=${RULESENGINEOPTIONS_EMPTYQUEUEDELAYMS:-1000}
      - RulesEngineOptions__MaxDequeueCount=${RULESENGINEOPTIONS_MAXDEQUEUECOUNT:-3}
    depends_on:
      - db
      - azurite
    command: printenv ConnectionStrings_AzureStorage
    networks:
      - cypd

  db:
    profiles: [database, all, e2e]
    container_name: cypd_db
    restart: unless-stopped
    image: postgres:18.1-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cypd}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cypd

  pgadmin:
    profiles: [database, all]
    image: dpage/pgadmin4:${PGADMIN_IMAGE_TAG:-latest}
    container_name: cypd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin/data
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - cypd

  azurite:
    profiles: [storage, all, e2e]
    container_name: cypd_azurite
    restart: unless-stopped
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    ports:
      - "10000:10000"  # Blob
      - "10001:10001"  # Queue
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --location /data --debug /data/debug.log
    networks:
      - cypd

  e2e-tests:
    profiles: [e2e]
    container_name: cypd_e2e_tests
    # Image tag is pinned in tests/DfE.CheckPerformanceData.E2ETests/Dockerfile
    # (FROM line) — must move in lockstep with the Microsoft.Playwright NuGet
    # version in src/Directory.Packages.props. Drift surfaces via
    # `bash scripts/check-playwright-pin.sh`.
    build:
      context: .
      dockerfile: tests/DfE.CheckPerformanceData.E2ETests/Dockerfile
    image: cypd_e2e_tests:latest
    working_dir: /work
    environment:
      - CPD_E2E_BASE_URL=${CPD_E2E_BASE_URL:-http://web:8080}
      - NUGET_PACKAGES=/root/.nuget/packages
      - DOTNET_NOLOGO=1
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
    # The bind-mount lets dotnet test see the full source tree and write
    # diff PNGs back to the host on visual-regression failure. The named
    # cpd-nuget-cache volume persists package restore across --rm runs so
    # subsequent invocations start in seconds, not minutes.
    volumes:
      - ./:/work
      - cpd-nuget-cache:/root/.nuget/packages
    # depends_on uses default condition (service_started). PlaywrightFixture
    # polls $CPD_E2E_BASE_URL/healthcheck (90s default, 2s interval) before
    # any test exercises the web app — that is the authoritative readiness
    # gate. (web service has no compose-level healthcheck today.)
    depends_on:
      - web
    networks:
      - cypd
    command: ["sh", "-c", "dotnet test tests/DfE.CheckPerformanceData.E2ETests/ --configuration Release"]

volumes:
  postgres_data:
  azurite_data:
  pgadmin_data:
  cpd-nuget-cache:

networks:
  cypd:
    driver: bridge