---
ASPNETCORE_ENVIRONMENT: Review
DfeSignIn__BaseUrl: https://test-api.signin.education.gov.uk/
DfeSignIn__ClientId: CheckPerformanceData
DfeSignIn__Audience: signin.education.gov.uk
DfeSignIn__MetadataAddress: https://test-oidc.signin.education.gov.uk/.well-known/openid-configuration
DfeSignIn__ServiceId: F9CB3B88-11F7-4E52-AEA6-2E5E22218DBB
GoogleTagManager__Enabled: true
GoogleTagManager__PreviewId: env-4
Clarity__Enabled: true
Clarity__ProjectId: wjrp3ai9r0
SeedDevelopmentData: true

# Review apps are ephemeral PR deploys used by the E2E suite, so the dev tooling
# surface (e.g. the dead-letter seed endpoint) is enabled here. The endpoint still
# hard-guards against Production regardless of this flag.
Dev__ToolsEnabled: true

# Rules Engine Worker configuration
RulesEngineOptions__QueueName: change-requests
RulesEngineOptions__RetryDelayMs: 5000
RulesEngineOptions__MaxMessagesPerPoll: 10
RulesEngineOptions__EmptyQueueDelayMs: 5000
RulesEngineOptions__MaxDequeueCount: 5
RulesEngineOptions__RulesBlobContainer: rules-config
RulesEngineOptions__RulesBlobName: rules.json
RulesEngineOptions__LookupsBlobName: country-languages.json
RulesEngineOptions__RefreshIntervalSeconds: 300
RulesEngineOptions__StalenessWarningSeconds: 1800

# Polly resilience settings
PollySettings__MaxRetryAttempts: 3
PollySettings__BaseDelayMilliseconds: 1000
PollySettings__JitterMilliseconds: 500

# Zendesk configuration (non-sensitive)
ZendeskSettings__Subdomain: dfe
ZendeskSettings__Domain: zendesk

# School Checking Exercise Zendesk settings
SchoolCheckingExercise__TargetViewTitle: School Performance Checks
SchoolCheckingExercise__GroupId: 16886472637330
SchoolCheckingExercise__BrandId: 16853215883538
